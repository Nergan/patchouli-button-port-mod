# Значения вида ${...} подставляются Gradle-задачей generateModMetadata
# из gradle.properties (см. build.gradle.kts).

modLoader = "javafml"
loaderVersion = "${loader_version_range}"

license = "${mod_license}"
issueTrackerURL = "https://github.com/Nergan/patchouli-button-neoforge-port-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Nergan/patchouli-button-neoforge-port-mod"
authors = "${mod_authors}"
description = '''
${mod_description}

One book that gathers every other mod's guide. Starter guide books can be cleared from the inventory.
Одна книга, в которую собраны гайды остальных модов. Стартовые книги-гайды можно убирать из инвентаря.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "${kff_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "patchouli"
type = "required"
versionRange = "${patchouli_version_range}"
ordering = "AFTER"
side = "BOTH"
